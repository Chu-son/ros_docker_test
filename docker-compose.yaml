x-compose: &common-settings
  build:
    context: .
    dockerfile: "docker/Dockerfile.ros2"
    args:
      ROS_DISTRO: humble

  tty: true
  network_mode: "host"
  privileged: true
  environment:
    - DISPLAY=${DISPLAY}
    - PYTHONUNBUFFERED=1
    - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - $HOME/.Xauthority/:/root/.Xauthority

services:
  talker:
    image: talker
    <<: *common-settings
    command: "ros2 run demo_nodes_py talker"

  listener:
    image: listener
    <<: *common-settings
    command: "ros2 run demo_nodes_py listener"

  idle:
    image: idle
    <<: *common-settings
    command: "sleep infinity"
