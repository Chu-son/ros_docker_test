x-compose: &common-settings
  build:
    context: .
    dockerfile: docker/Dockerfile.ros
    args:
      ROS_DISTRO: noetic
  tty: true
  network_mode: host
  privileged: true
  environment:
    - DISPLAY=${DISPLAY}
    - PYTHONUNBUFFERED=1

  env_file:
    - .env

  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - $HOME/.Xauthority/:/root/.Xauthority

services:
  ros1_idle:
    image: ros1_idle
    <<: *common-settings
    command: "sleep infinity"
  ros1_core:
    image: ros1_core
    <<: *common-settings
    command: "roscore"
